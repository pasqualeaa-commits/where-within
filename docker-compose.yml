services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # config attiva (init-ssl.sh sostituisce questo file dopo il primo cert)
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # certificati Let's Encrypt
      - ./nginx/letsencrypt:/etc/letsencrypt:ro
      # webroot per le challenge ACME di certbot
      - ./nginx/webroot:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - internal

  # Servizio per i seed script — usa lo stage "scripts" che ha tsx e devDeps
  # Uso: docker compose run --rm scripts npm run db:seed
  scripts:
    build:
      context: .
      target: scripts
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    dns:
      - 8.8.8.8
      - 1.1.1.1
    profiles: ["scripts"]

  # Servizio certbot — usato solo per rinnovo automatico (non parte con "up")
  certbot:
    image: certbot/certbot:latest
    profiles: ["certbot"]
    volumes:
      - ./nginx/letsencrypt:/etc/letsencrypt
      - ./nginx/webroot:/var/www/certbot
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
